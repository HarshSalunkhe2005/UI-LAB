<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tally - Today</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --kraft:#c9a66b; --surface:#a9bd93; --raised:#fbf3dc; --ink:#20301a; --ink-muted:#33422a;
  --accent:#1f6a35; --accent-ink:#ffffff; --border:#5b6b48; --sunk:#e6dcc0;
  --font-display:'Rubik','Arial Rounded MT Bold',system-ui,sans-serif;
  --font-text:'Lora',Georgia,serif;
  --radius:14px; --dur-fast:150ms; --dur:420ms; --ease:cubic-bezier(.3,.9,.3,1);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--kraft);color:var(--ink);font-family:var(--font-text);font-size:1rem;line-height:1.45;
  display:grid;place-items:center;min-height:100dvh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.tn{font-variant-numeric:tabular-nums}

/* device */
.device{width:390px;height:min(844px,100dvh - 32px);background:var(--ink);border-radius:52px;padding:10px;
  box-shadow:0 0 0 2px #0e170a;position:relative}
.screen{position:relative;height:100%;background:var(--surface);border-radius:42px;overflow:hidden;display:flex;flex-direction:column;isolation:isolate}
.status{display:flex;justify-content:space-between;align-items:center;padding:14px 28px 4px;font:600 .8125rem var(--font-display);flex:none}
.status svg{display:block}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 16px 24px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;padding:8px 4px 14px}
.top small{display:block;font:500 .8125rem var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
h1{font:700 2.25rem/1 var(--font-display);letter-spacing:-.02em}
.brand{font:700 1.0625rem var(--font-display);display:flex;align-items:center;gap:6px;min-height:44px}

/* packet = cream card */
.packet{background:var(--raised);border:2px solid var(--ink);border-radius:var(--radius)}

/* streak */
.streak{display:grid;grid-template-columns:104px 1fr;gap:14px;padding:12px;align-items:center}
.window{border-radius:10px;border:2px solid var(--ink);background:#d9e6c3;aspect-ratio:1;overflow:hidden;position:relative}
.window svg{width:100%;height:100%;display:block}
.sprout-g{transform-origin:50px 90px;transition:transform var(--dur) var(--ease)}
.streak .n{font:700 3.5rem/.9 var(--font-display);letter-spacing:-.03em;display:inline-block}
.streak .n.bump{animation:bump .45s var(--ease)}
.streak .u{font:600 1rem var(--font-display);margin-left:6px}
.streak p{font-size:.875rem;color:var(--ink-muted);margin-top:8px}
.streak p b{color:var(--ink);font-weight:600}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}

/* week */
.week{margin-top:14px;padding:12px 8px 10px}
.week h2,.list-h h2{font:600 .8125rem var(--font-display);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-muted)}
.week h2{padding:0 6px 8px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;list-style:none;padding:0}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px;border-radius:12px;padding:4px 0;justify-content:center}
.day .dl{font:500 .75rem var(--font-display);color:var(--ink-muted)}
.day .dn{font:600 .75rem var(--font-display)}
.day svg{width:30px;height:30px}
.day.today{background:var(--ink);color:var(--raised)}
.day.today .dl{color:#dfe8cf}
.ring-bg{stroke:var(--sunk)}.today .ring-bg{stroke:#4a5c3d}
.ring-fg{stroke:var(--accent);transition:stroke-dashoffset var(--dur) var(--ease)}
.today .ring-fg{stroke:#a8e0a0}

/* list */
.list-h{display:flex;justify-content:space-between;align-items:baseline;margin:20px 4px 10px}
.list-h .prog{font:600 .9375rem var(--font-display)}
.bar{height:10px;border-radius:6px;background:var(--sunk);border:2px solid var(--ink);margin:0 4px 12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width var(--dur) var(--ease)}
.habits{list-style:none;padding:0;display:grid;gap:10px}
.habit{display:grid;grid-template-columns:52px 1fr 48px;gap:12px;align-items:center;padding:10px;
  transition:background var(--dur-fast)}
.ic{width:52px;height:52px;border-radius:10px;border:2px solid var(--ink);display:grid;place-items:center;background:var(--c);color:var(--ink)}
.ic svg{width:28px;height:28px}
.nm{font:600 1.0625rem/1.15 var(--font-display);display:block}
.ins{font-size:.8125rem;color:var(--ink-muted);display:block;margin-top:3px}
.habit.done{background:#e3efd2}
.habit.done .nm{text-decoration:line-through;text-decoration-thickness:2px}
.check{width:48px;height:48px;border-radius:50%;border:2.5px solid var(--ink);background:var(--raised);display:grid;place-items:center;transition:background var(--dur-fast),transform var(--dur-fast)}
.check svg{width:24px;height:24px;stroke:var(--accent-ink);stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:26;stroke-dashoffset:26;transition:stroke-dashoffset var(--dur) var(--ease)}
.check[aria-pressed="true"]{background:var(--accent)}
.check[aria-pressed="true"] svg{stroke-dashoffset:0}
.check:active{transform:scale(.92)}

/* other tabs */
.view[hidden]{display:none}
.rows{list-style:none;padding:0;display:grid;gap:10px}
.rows li{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px}
.rows .big{font:700 1.5rem var(--font-display);text-align:right}
.rows .big small{display:block;font:500 .75rem var(--font-display);color:var(--ink-muted)}
.stat{padding:16px}
.stat h2{font:600 .8125rem var(--font-display);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-muted)}
.cols{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:170px;margin-top:12px}
.col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;font:500 .75rem var(--font-display);color:var(--ink-muted)}
.col i{display:block;width:100%;background:var(--accent);border:2px solid var(--ink);border-radius:6px 6px 2px 2px;min-height:4px}
.col b{color:var(--ink);font-weight:600}
.big-note{font-size:.9375rem;margin-top:12px}

/* tab bar */
.tabbar{flex:none;background:var(--raised);border-top:2px solid var(--ink);display:grid;grid-template-columns:repeat(3,1fr);padding:6px 10px calc(18px + env(safe-area-inset-bottom))}
.tab{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:12px;
  font:600 .75rem var(--font-display);color:var(--ink-muted)}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink);background:#dbe7c6}
.tab[aria-current="page"] svg{stroke:var(--accent);stroke-width:2.6}
.home-bar{position:absolute;left:50%;bottom:6px;width:120px;height:4px;border-radius:3px;background:var(--ink);transform:translateX(-50%);opacity:.8;pointer-events:none}

/* phone-size: be the app */
@media (max-width:430px){
  body{display:block;background:var(--surface)}
  .device{width:100%;height:100dvh;border-radius:0;padding:0;box-shadow:none;background:none}
  .screen{border-radius:0}
  .status,.home-bar{display:none}
  .tabbar{padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  .scroll{padding-top:calc(8px + env(safe-area-inset-top))}
}
@media (max-width:360px){.streak{grid-template-columns:88px 1fr}.streak .n{font-size:3rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="device">
 <div class="screen">
  <div class="status" aria-hidden="true"><span>9:41</span>
   <svg width="54" height="12" viewBox="0 0 54 12"><rect x="0" y="7" width="3" height="5" rx="1" fill="currentColor"/><rect x="5" y="5" width="3" height="7" rx="1" fill="currentColor"/><rect x="10" y="2" width="3" height="10" rx="1" fill="currentColor"/><rect x="26" y="1" width="26" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="28" y="3" width="17" height="6" rx="1.5" fill="currentColor"/></svg></div>

  <div class="scroll" id="scroll">
   <header class="top">
     <div><small>Sunday, 1 November</small><h1 id="title">Today</h1></div>
     <div class="brand"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 3v16M10 3v16M15 3v16M2 15L19 7"/></svg>Tally</div>
   </header>

   <main>
   <section class="view" id="v-today" aria-label="Today">
    <div class="packet streak">
      <div class="window" aria-hidden="true">
        <svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#d9e6c3"/><path d="M0 84q25-8 50 0t50 0V100H0z" fill="#8a6b3a"/>
         <g class="sprout-g" id="sprout"><path d="M50 88V52" stroke="#1f6a35" stroke-width="4" stroke-linecap="round"/>
         <path d="M50 66q-20-2-24-20 20-2 24 20z" fill="#2f8f46" stroke="#20301a" stroke-width="2.5" stroke-linejoin="round"/>
         <path d="M50 56q18 0 24-18-20-4-24 18z" fill="#4faa5a" stroke="#20301a" stroke-width="2.5" stroke-linejoin="round"/></g></svg>
      </div>
      <div>
        <div><span class="n tn" id="streak">12</span><span class="u">day streak</span></div>
        <p id="hint">Finish <b>3 of 6</b> to keep it growing.</p>
      </div>
    </div>

    <section class="packet week" aria-labelledby="wk">
      <h2 id="wk">This week</h2>
      <ol class="days" id="days"></ol>
    </section>

    <div class="list-h"><h2>Today's habits</h2><span class="prog tn" id="prog" aria-live="polite">0 of 6</span></div>
    <div class="bar" role="progressbar" aria-label="Habits done today" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0" id="bar"><i></i></div>
    <ul class="habits" id="habits"></ul>
   </section>

   <section class="view" id="v-habits" aria-label="Habits" hidden>
    <ul class="rows" id="rows"></ul>
   </section>

   <section class="view" id="v-stats" aria-label="Stats" hidden>
    <div class="packet stat">
      <h2>Habits done per day</h2>
      <div class="cols" id="cols"></div>
      <p class="big-note" id="statnote"></p>
    </div>
   </section>
   </main>
  </div>

  <nav class="tabbar" aria-label="Main">
    <button class="tab" data-v="today" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V11M12 14c-5 0-7-3-7-7 5 0 7 3 7 7zM12 12c0-3 2-5 6-5 0 4-2 5-6 5z"/></svg>Today</button>
    <button class="tab" data-v="habits"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>Habits</button>
    <button class="tab" data-v="stats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Stats</button>
  </nav>
  <div class="home-bar" aria-hidden="true"></div>
 </div>
</div>

<script>
(function(){
  var ICONS={
    water:'<path d="M12 3c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>',
    read:'<path d="M3 5c3-1 6-1 9 1 3-2 6-2 9-1v14c-3-1-6-1-9 1-3-2-6-2-9-1z M12 6v14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>',
    run:'<circle cx="15" cy="5" r="2.2" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M5 13l4-3 4 2 2 4 4 1M9 10l-1 5-4 4M13 12l-2 4 3 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
    sit:'<circle cx="12" cy="6" r="2.4" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 9v5M5 19c2-5 12-5 14 0M7 13l5 1 5-1" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
    pen:'<path d="M4 20l1-5L16 4l4 4L9 19z M14 6l4 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>',
    moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>'
  };
  var H=[
    {id:'water',n:'Drink 2 litres of water',i:'Sow: all day, 4 glasses by noon',c:'#9fcbe0',ic:'water',s:21},
    {id:'read',n:'Read 20 pages',i:'Sow: after dinner, 25 min',c:'#f0b99a',ic:'read',s:12},
    {id:'run',n:'Morning run',i:'Sow: before 8, 3 km',c:'#f2d98a',ic:'run',s:5},
    {id:'sit',n:'Ten minutes of stillness',i:'Sow: right after waking',c:'#cfc4ea',ic:'sit',s:34},
    {id:'pen',n:'Write three lines',i:'Sow: evening, any notebook',c:'#bfe0b0',ic:'pen',s:8},
    {id:'moon',n:'Lights out by 11',i:'Sow: phone charging across the room',c:'#e9b8c8',ic:'moon',s:3}
  ];
  var DAYS=['M','T','W','T','F','S','S'], DATES=[26,27,28,29,30,31,1];
  var BASE=11, NEED=3, KEY='tally.v1.2026-11-01';
  var state={done:{}};
  try{var raw=localStorage.getItem(KEY);if(raw)state=JSON.parse(raw)||state}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
  var $=function(s){return document.querySelector(s)};
  function count(){return H.filter(function(h){return state.done[h.id]}).length}

  var ul=$('#habits');
  H.forEach(function(h){
    var li=document.createElement('li');li.className='packet habit';li.dataset.id=h.id;
    li.innerHTML='<span class="ic" style="--c:'+h.c+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+ICONS[h.ic]+'</svg></span>'+
      '<span><span class="nm">'+h.n+'</span><span class="ins">'+h.i+'</span></span>'+
      '<button class="check" aria-pressed="false" aria-label="'+h.n+'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>';
    li.querySelector('.check').addEventListener('click',function(){
      state.done[h.id]=!state.done[h.id];save();render(true);
    });
    ul.appendChild(li);
  });

  var CIRC=2*Math.PI*12;
  var dl=$('#days');
  var pastFrac=[1,5/6,4/6,1,1,3/6];
  DAYS.forEach(function(d,i){
    var li=document.createElement('li');li.className='day'+(i===6?' today':'');
    if(i===6)li.setAttribute('aria-current','date');
    var f=i<6?pastFrac[i]:0;
    li.innerHTML='<span class="dl" aria-hidden="true">'+d+'</span><svg viewBox="0 0 30 30" aria-hidden="true"><circle class="ring-bg" cx="15" cy="15" r="12" fill="none" stroke-width="4"/><circle class="ring-fg" cx="15" cy="15" r="12" fill="none" stroke-width="4" stroke-linecap="round" transform="rotate(-90 15 15)" stroke-dasharray="'+CIRC+'" stroke-dashoffset="'+(CIRC*(1-f))+'"/></svg><span class="dn tn" aria-hidden="true">'+DATES[i]+'</span>';
    if(i<6)li.setAttribute('aria-label',Math.round(f*6)+' of 6 done on '+DATES[i]+(DATES[i]>26?' ':' ')+(i<5?'October':'October'));
    dl.appendChild(li);
  });
  // fix labels: 26-31 are October
  Array.prototype.forEach.call(dl.children,function(li,i){if(i<6)li.setAttribute('aria-label',Math.round(pastFrac[i]*6)+' of 6 done on '+DATES[i]+' October')});

  var rows=$('#rows');
  function renderRows(){
    rows.innerHTML='';
    H.forEach(function(h){
      var s=h.s-1+(state.done[h.id]?1:0);
      var li=document.createElement('li');li.className='packet';
      li.innerHTML='<span class="ic" style="--c:'+h.c+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+ICONS[h.ic]+'</svg></span><span><span class="nm">'+h.n+'</span><span class="ins">'+h.i+'</span></span><span class="big tn">'+s+'<small>days</small></span>';
      rows.appendChild(li);
    });
  }
  function renderStats(){
    var cols=$('#cols');cols.innerHTML='';var tot=0;
    for(var i=0;i<7;i++){
      var v=i<6?Math.round(pastFrac[i]*6):count();tot+=v;
      var c=document.createElement('div');c.className='col';
      c.innerHTML='<b class="tn">'+v+'</b><i style="height:'+(v/6*78)+'%"></i><span>'+DAYS[i]+'</span>';
      cols.appendChild(c);
    }
    $('#statnote').textContent=tot+' of 42 habits done this week ('+Math.round(tot/42*100)+'%).';
  }

  function render(animate){
    var n=count(),total=H.length,ok=n>=NEED,streak=BASE+(ok?1:0);
    document.querySelectorAll('.habit').forEach(function(li){
      var d=!!state.done[li.dataset.id];li.classList.toggle('done',d);
      li.querySelector('.check').setAttribute('aria-pressed',d);
    });
    $('#prog').textContent=n+' of '+total;
    var bar=$('#bar');bar.setAttribute('aria-valuenow',n);bar.firstElementChild.style.width=(n/total*100)+'%';
    var sn=$('#streak');
    if(sn.textContent!==String(streak)){sn.textContent=streak;sn.classList.remove('bump');void sn.offsetWidth;if(animate)sn.classList.add('bump')}
    $('#hint').innerHTML=ok?(n===total?'Every packet sown. Good day.':'Streak kept today. <b>'+(total-n)+' more</b> to clear the board.'):'Finish <b>'+(NEED-n)+' more</b> to keep it growing.';
    $('#sprout').style.transform='scale('+(0.55+0.45*(n/total))+')';
    var today=dl.lastElementChild;
    today.querySelector('.ring-fg').setAttribute('stroke-dashoffset',CIRC*(1-n/total));
    today.setAttribute('aria-label','Today, 1 November, '+n+' of '+total+' done');
    renderRows();renderStats();
  }
  render(false);

  var tabs=document.querySelectorAll('.tab');
  var titles={today:'Today',habits:'Habits',stats:'Stats'};
  tabs.forEach(function(t){t.addEventListener('click',function(){
    var v=t.dataset.v;
    tabs.forEach(function(x){x.removeAttribute('aria-current')});t.setAttribute('aria-current','page');
    document.querySelectorAll('.view').forEach(function(s){s.hidden=s.id!=='v-'+v});
    $('#title').textContent=titles[v];
    $('#scroll').scrollTop=0;
  })});
})();
</script>
</body>
</html>
