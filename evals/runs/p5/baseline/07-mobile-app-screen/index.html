<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tally - Today</title>
<meta name="theme-color" content="#f6f1e8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1e8; --card:#fffdf8; --ink:#1f2a24; --muted:#5c635a; --line:#e6dfd0;
  --accent:#2f7d5b; --accent-ink:#fff; --flame:#e8793a; --soft:#e4efe7;
  --shadow:0 1px 2px rgba(31,42,36,.06),0 6px 18px rgba(31,42,36,.06);
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Fraunces",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:#d9d3c6;display:flex;align-items:center;justify-content:center;min-height:100dvh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* device frame (desktop) */
.device{width:390px;height:812px;max-height:calc(100dvh - 32px);background:var(--bg);border-radius:46px;position:relative;overflow:hidden;
  box-shadow:0 0 0 10px #1b1f1c,0 0 0 11px #3a403b,0 30px 70px rgba(20,25,20,.35);display:flex;flex-direction:column}
.status{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 28px 0;font-size:14px;font-weight:600}
.status .notch{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:96px;height:26px;border-radius:14px;background:#1b1f1c}
.status svg{display:block}
.status .r{display:flex;gap:6px;align-items:center}

.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 20px 24px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

header.top{display:flex;align-items:center;justify-content:space-between;margin:6px 0 18px}
.hello small{display:block;font-size:13px;color:var(--muted);font-weight:500}
.hello h1{font-family:var(--serif);font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:15px}

/* hero */
.hero{background:var(--ink);color:#f6f1e8;border-radius:26px;padding:20px;display:flex;align-items:center;gap:18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(232,121,58,.35),transparent 70%)}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring .trk{stroke:rgba(255,255,255,.14)}
.ring .bar{stroke:#7ed3a4;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.3,.8,.3,1)}
.ring .ctr{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .ctr b{font-family:var(--serif);font-size:26px;font-weight:700}
.ring .ctr span{font-size:11px;opacity:.65;display:block;margin-top:3px}
.streak{position:relative;z-index:1}
.streak .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.65;font-weight:600}
.streak .num{display:flex;align-items:baseline;gap:6px;margin:2px 0 4px}
.streak .num b{font-family:var(--serif);font-size:48px;line-height:1;font-weight:700;display:inline-block}
.streak .num span{font-size:16px;opacity:.85}
.streak .msg{font-size:13px;opacity:.75;line-height:1.35}
.flame{display:inline-block;vertical-align:-3px;margin-right:2px}
.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}

/* week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:18px 0 6px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--ink);background:var(--card);border:1.5px solid var(--line);position:relative;transition:background .3s,border-color .3s}
.dot.done{background:var(--accent);border-color:var(--accent);color:#fff}
.dot.miss{background:transparent;border-style:dashed;color:var(--muted)}
.dot.future{background:transparent;color:var(--muted);opacity:.6}
.dot.today{border-color:var(--ink);border-width:2px}
.dot.today.done{border-color:var(--accent)}
.dot.today .mini{position:absolute;inset:-5px}
.dot svg.ck{width:16px;height:16px}

/* list */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 10px}
.sec h2{font-size:17px;font-weight:700}
.sec span{font-size:13px;color:var(--muted);font-weight:500}
ul.habits{list-style:none;display:flex;flex-direction:column;gap:10px}
.habit{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border-radius:20px;padding:12px 14px 12px 12px;box-shadow:var(--shadow);border:1.5px solid transparent;transition:transform .15s,background .3s,border-color .3s}
.habit:active{transform:scale(.975)}
.habit .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--soft);transition:background .3s}
.habit .ico svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.habit .txt{flex:1;min-width:0}
.habit .name{font-weight:600;font-size:15.5px;transition:color .3s}
.habit .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.check{width:30px;height:30px;border-radius:50%;border:2px solid #cfc7b6;display:grid;place-items:center;flex:none;transition:background .25s,border-color .25s,transform .3s cubic-bezier(.3,1.6,.5,1)}
.check svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .3s .05s}
.habit[aria-pressed="true"]{background:#f1f7f2;border-color:#cfe2d5}
.habit[aria-pressed="true"] .name{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(123,129,120,.6)}
.habit[aria-pressed="true"] .check{background:var(--accent);border-color:var(--accent);transform:scale(1.08)}
.habit[aria-pressed="true"] .check svg{stroke-dashoffset:0}
.habit[aria-pressed="true"] .ico{background:#d3e7da}

.allDone{display:none;margin-top:14px;text-align:center;font-size:14px;color:#1f5c42;font-weight:600;background:var(--soft);padding:12px;border-radius:16px}
.allDone.on{display:block;animation:pop .4s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* tab bar */
nav.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:rgba(255,253,248,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);position:relative}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 2px;font-size:11px;font-weight:600;color:var(--muted);min-height:48px;transition:color .2s}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button[aria-current="page"] svg{fill:var(--soft)}
.homebar{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:130px;height:5px;border-radius:3px;background:#1b1f1c;opacity:.85}
.toast{position:absolute;left:50%;bottom:92px;transform:translate(-50%,20px);background:var(--ink);color:#fff;font-size:13px;padding:9px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:.3s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* real phones: drop the frame */
@media (max-width:430px){
  body{background:var(--bg);display:block}
  .device{width:100%;height:100dvh;max-height:none;border-radius:0;box-shadow:none}
  .status,.homebar{display:none}
  .scroll{padding-top:calc(14px + env(safe-area-inset-top))}
}
@media (max-height:640px) and (min-width:431px){ .device{height:calc(100dvh - 20px)} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="device" id="app">
  <div class="status" aria-hidden="true">
    <span>9:41</span><div class="notch"></div>
    <span class="r">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx=".8"/><rect x="4.7" y="5" width="3" height="6" rx=".8"/><rect x="9.4" y="2.5" width="3" height="8.5" rx=".8"/><rect x="14" y="0" width="3" height="11" rx=".8"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.2" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/><rect x="23" y="4" width="1.6" height="4" rx=".8" fill="currentColor" opacity=".5"/></svg>
    </span>
  </div>

  <main class="scroll" id="scroll">
    <header class="top">
      <div class="hello"><small id="dateLine"></small><h1 id="greet">Good morning</h1></div>
      <div class="avatar" aria-label="Profile">H</div>
    </header>

    <section class="hero" aria-label="Streak and progress">
      <div class="ring" role="img" id="ringLabel">
        <svg width="96" height="96" viewBox="0 0 96 96"><circle class="trk" cx="48" cy="48" r="40" fill="none" stroke-width="9"/><circle class="bar" id="bar" cx="48" cy="48" r="40" fill="none" stroke-width="9" stroke-dasharray="251.33" stroke-dashoffset="251.33"/></svg>
        <div class="ctr"><div><b id="pct">0%</b><span id="frac">0 of 5</span></div></div>
      </div>
      <div class="streak">
        <div class="lbl">Current streak</div>
        <div class="num"><b id="streakNum" aria-live="polite">0</b><span>days</span></div>
        <div class="msg" id="streakMsg"></div>
      </div>
    </section>

    <section class="week" id="week" aria-label="This week"></section>

    <div class="sec"><h2>Today's habits</h2><span id="left"></span></div>
    <ul class="habits" id="list"></ul>
    <div class="allDone" id="allDone" role="status">All done. Streak extended, nice work.</div>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <nav class="tabs" aria-label="Main">
    <button aria-current="page" data-tab="Today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.3l2.5 2.5 4.5-5"/></svg>Today</button>
    <button data-tab="Habits"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></svg>Habits</button>
    <button data-tab="Stats"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Stats</button>
    <button data-tab="Profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1-4 4-5.5 7.500-5.500s6.500 1.500 7.500 5.500"/></svg>Profile</button>
    <div class="homebar" aria-hidden="true" style="bottom:4px"></div>
  </nav>
</div>

<script>
(function(){
  var ICONS = {
    water:'<path d="M12 3.500c3 3.700 5.500 6.500 5.500 9.800a5.500 5.500 0 0 1-11 0C6.500 10 9 7.200 12 3.500z"/>',
    book:'<path d="M5 5.500A2 2 0 0 1 7 4h12v14H7a2 2 0 0 0-2 2z"/><path d="M5 19.500V5.500M9 8h6"/>',
    run:'<circle cx="14.500" cy="5" r="1.800"/><path d="M8 20l3-5.500-2-2.500 3-3.500 2.500 2.500 3 .5M11 14.500l3 1.500 1 4"/>',
    moon:'<path d="M20 14.500A8 8 0 1 1 9.500 4a6.500 6.500 0 0 0 10.500 10.500z"/>',
    pen:'<path d="M4 20l1-4L16.500 4.500a2 2 0 0 1 3 3L8 19z"/><path d="M14.500 6.500l3 3"/>'
  };
  var BASE = 12; // consecutive completed days before today
  var habits = [
    {id:'water', name:'Drink 2L water', meta:'Anytime today', icon:'water', done:true},
    {id:'read',  name:'Read 20 pages', meta:'Before 9 pm', icon:'book', done:false},
    {id:'run',   name:'Morning run', meta:'30 min', icon:'run', done:true},
    {id:'write', name:'Journal', meta:'3 lines is enough', icon:'pen', done:false},
    {id:'sleep', name:'Lights out by 11', meta:'Wind down at 10:30', icon:'moon', done:false}
  ];
  // previous 6 days (oldest first): true = all done. Last BASE days done, so show last 3 done + one earlier miss
  var prior = [false,true,true,true,true,true];

  var $ = function(id){return document.getElementById(id)};
  var now = new Date();
  var dow = (now.getDay()+6)%7; // Mon=0
  var names = ['M','T','W','T','F','S','S'];

  var h = now.getHours();
  $('greet').textContent = h<12?'Good morning':h<18?'Good afternoon':'Good evening';
  $('dateLine').textContent = now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});

  var CK = '<svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg>';
  var R = 40, C = 2*Math.PI*R, lastAll = null;

  function buildList(){
    var ul = $('list'); ul.innerHTML='';
    habits.forEach(function(hb,i){
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.className='habit'; b.type='button';
      b.setAttribute('aria-pressed', hb.done);
      b.innerHTML = '<span class="ico"><svg viewBox="0 0 24 24">'+ICONS[hb.icon]+'</svg></span>'+
        '<span class="txt"><div class="name">'+hb.name+'</div><div class="meta">'+hb.meta+'</div></span>'+
        '<span class="check"><svg viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg></span>';
      b.addEventListener('click', function(){
        hb.done = !hb.done;
        b.setAttribute('aria-pressed', hb.done);
        if (navigator.vibrate) try{navigator.vibrate(hb.done?12:6)}catch(e){}
        update(true);
      });
      li.appendChild(b); ul.appendChild(li);
    });
  }

  function buildWeek(allToday, frac){
    var w = $('week'); w.innerHTML='';
    for (var i=0;i<7;i++){
      var d = document.createElement('div'); d.className='day';
      var date = new Date(now); date.setDate(now.getDate()-(dow-i));
      var cls='dot', inner=date.getDate();
      if (i<dow){
        var ok = prior[prior.length-(dow-i)];
        if (ok){cls+=' done'; inner=CK;} else cls+=' miss';
      } else if (i===dow){
        cls+=' today'; if (allToday){cls+=' done'; inner=CK;}
        else inner = date.getDate()+'<svg class="mini" viewBox="0 0 48 48"><circle cx="24" cy="24" r="21.500" fill="none" stroke="#2f7d5b" stroke-width="2.500" stroke-linecap="round" stroke-dasharray="'+(2*Math.PI*21.5)+'" stroke-dashoffset="'+(2*Math.PI*21.5*(1-frac))+'" transform="rotate(-90 24 24)"/></svg>';
      } else cls+=' future';
      d.innerHTML = '<span>'+names[i]+'</span><div class="'+cls+'">'+inner+'</div>';
      w.appendChild(d);
    }
  }

  function update(animate){
    var n = habits.length, done = habits.filter(function(x){return x.done}).length;
    var all = done===n, frac = done/n;
    var streak = BASE + (all?1:0);
    $('bar').style.strokeDashoffset = C*(1-frac);
    $('pct').textContent = Math.round(frac*100)+'%';
    $('frac').textContent = done+' of '+n;
    $('ringLabel').setAttribute('aria-label', done+' of '+n+' habits done');
    var sn = $('streakNum');
    sn.innerHTML = '<svg class="flame" width="30" height="30" viewBox="0 0 24 24"><path d="M12 2.500c.5 3-1.500 4.500-3 6.500-1.300 1.800-2 3.200-2 5a5 5 0 0 0 10 0c0-1.800-.8-3-1.800-4.200-.3 1-.9 1.700-1.700 2 .6-3-.1-6.500-1.500-9.300z" fill="#e8793a"/></svg>'+streak;
    if (animate && lastAll!==null && all!==lastAll){ sn.classList.remove('bump'); void sn.offsetWidth; sn.classList.add('bump'); }
    $('streakMsg').textContent = all ? 'Today is locked in. Come back tomorrow.' :
      (n-done)===1 ? 'One more to keep your '+BASE+'-day streak alive.' :
      'Finish all '+n+' to keep your streak alive.';
    $('left').textContent = all ? 'Complete' : (n-done)+' left';
    $('allDone').classList.toggle('on', all);
    if (animate && all && lastAll===false) toast('Streak extended to '+streak+' days');
    lastAll = all;
    buildWeek(all, frac);
  }

  var tt;
  function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},1800)}

  document.querySelectorAll('nav.tabs button').forEach(function(b){
    b.addEventListener('click', function(){
      if (b.dataset.tab==='Today'){return}
      toast(b.dataset.tab+' is not part of this screen');
    });
  });

  buildList(); update(false);
})();
</script>
</body>
</html>
