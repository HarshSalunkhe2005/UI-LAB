<!doctype html>
<!--
pattern: product-gallery
title: Product gallery with thumbnails and keyboard support
category: Commerce
tier: pro
when: A product detail page with several images or views. One large view, a row of thumbnails, no carousel library.
a11y: Thumbnails are real buttons in a labelled group with aria-pressed; the large image changes alt text with the selection; the current view is announced via a polite status line; targets are 56px.
adapt: Replace the SVG placeholders with real photographs and keep explicit width and height to avoid layout shift. Preload only the first image. At 375 show thumbnails below the main view.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product gallery</title>
<style>
:root{--surface:#f4f1ea;--ink:#1b1d1f;--ink-muted:#555a60;--accent:#233b52;--border:#d4cfc2}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:24px 16px}
.g{max-width:560px;margin:0 auto}
.main{aspect-ratio:1;border-radius:12px;overflow:clip;background:#e4dfd2;display:grid;place-items:center}
.main svg{width:100%;height:100%;display:block}
.thumbs{display:flex;gap:10px;margin-top:12px}
.thumbs button{width:64px;height:64px;padding:0;border:2px solid transparent;border-radius:8px;background:#e4dfd2;cursor:pointer;overflow:clip}
.thumbs button[aria-pressed=true]{border-color:var(--accent)}
.thumbs button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.thumbs svg{width:100%;height:100%;display:block}
.status{font-size:.875rem;color:var(--ink-muted);margin:8px 0 0}
</style>
</head>
<body>
<main>
<div class="g" role="group" aria-label="Product images">
  <div class="main" id="main"></div>
  <div class="thumbs" id="thumbs"></div>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</div>
</main>
<script>
const views = [
  { name: 'Front view', c: '#233b52', body: '<rect x="35" y="22" width="30" height="58" rx="8" fill="#233b52"/><rect x="42" y="30" width="16" height="6" rx="3" fill="#e4dfd2"/>' },
  { name: 'Side view', c: '#2f4f6d', body: '<rect x="40" y="22" width="20" height="58" rx="8" fill="#2f4f6d"/>' },
  { name: 'Open, showing the inside', c: '#b3532a', body: '<rect x="30" y="22" width="40" height="58" rx="8" fill="#233b52"/><rect x="36" y="32" width="28" height="40" rx="4" fill="#b3532a"/>' },
]
const svg = (v) => `<svg viewBox="0 0 100 100" role="img" aria-label="${v.name}">${v.body}</svg>`
const main = document.getElementById('main'), th = document.getElementById('thumbs'), st = document.getElementById('status')
function show(i) {
  main.innerHTML = svg(views[i])
  ;[...th.children].forEach((b, j) => b.setAttribute('aria-pressed', String(i === j)))
  st.textContent = `Showing view ${i + 1} of ${views.length}: ${views[i].name}`
}
views.forEach((v, i) => { const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', v.name); b.innerHTML = svg(v).replace('role="img" aria-label="' + v.name + '"', 'aria-hidden="true"'); b.addEventListener('click', () => show(i)); th.append(b) })
show(0)
</script>
</body>
</html>
