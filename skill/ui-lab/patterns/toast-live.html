<!doctype html>
<!--
pattern: toast-live
title: Toast messages in a live region
category: Forms and states
tier: pro
when: Short confirmations after an action ("Saved", "Copied") and errors that do not block. Not for anything the user must act on: use inline messages or dialogs for those.
a11y: A single polite live region (role="status") holds confirmations; errors use role="alert" in a separate region; toasts have a close button, stay long enough to read (at least 5 s, longer with more text) and pause on hover and focus; reduced motion removes the slide.
adapt: Stack at most three. Never use a toast as the only record of something important. Place at the bottom on mobile above any sticky bar.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toasts</title>
<style>
:root{--surface:#fff;--ink:#17191c;--toast:#17191c;--toast-ink:#fff;--danger:#8f1d12;--accent:#233b52}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);padding:32px 16px}
button.go{min-height:44px;padding:0 18px;border:1.5px solid var(--accent);border-radius:8px;background:#fff;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;margin-right:8px}
.region{position:fixed;left:16px;right:16px;bottom:16px;display:grid;gap:8px;justify-items:start;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--toast);color:var(--toast-ink);border-radius:8px;padding:6px 6px 6px 16px;min-height:48px;max-width:420px}
.toast.err{background:var(--danger)}
.toast button{min-height:44px;min-width:44px;border:0;background:transparent;color:inherit;font:inherit;font-size:1.25rem;cursor:pointer;border-radius:6px}
.toast button:focus-visible,button.go:focus-visible{outline:3px solid #f3c93e;outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.toast{animation:in .2s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}}}
</style>
</head>
<body>
<main>
<button class="go" id="ok" type="button">Save changes</button>
<button class="go" id="bad" type="button">Trigger an error</button>
</main>
<div class="region" id="status" role="status" aria-live="polite"></div>
<div class="region" id="alert" role="alert" style="bottom:auto;top:16px"></div>
<script>
function toast(text, kind) {
  const host = document.getElementById(kind === 'err' ? 'alert' : 'status')
  const t = document.createElement('div'); t.className = 'toast ' + (kind || '')
  t.innerHTML = '<span></span><button type="button" aria-label="Dismiss">&times;</button>'
  t.firstChild.textContent = text
  const close = () => t.remove()
  t.querySelector('button').addEventListener('click', close)
  let timer = setTimeout(close, Math.max(5000, text.length * 80))
  t.addEventListener('mouseenter', () => clearTimeout(timer)); t.addEventListener('focusin', () => clearTimeout(timer))
  host.append(t)
  while (host.children.length > 3) host.firstChild.remove()
}
document.getElementById('ok').addEventListener('click', () => toast('Changes saved.'))
document.getElementById('bad').addEventListener('click', () => toast('Could not reach the server. Your changes are kept on this page.', 'err'))
</script>
</body>
</html>
