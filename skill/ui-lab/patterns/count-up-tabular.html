<!doctype html>
<!--
pattern: count-up-tabular
title: Number that counts up once, in tabular figures
category: Motion
tier: pro
when: A single headline figure that benefits from a brief count to its value on first view. Use sparingly; one per page. Not for numbers users need to read immediately.
a11y: The final value is in the markup as text, and the animated span is aria-hidden so a screen reader reads the final number once; reduced motion shows the final value at once; tabular figures prevent width jitter.
adapt: Count over 600 to 900 ms with ease-out. Format with Intl.NumberFormat for the locale. Skip the count if the value changes often (live data): update in place instead.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Count up</title>
<style>
:root{--surface:#101615;--ink:#f1f3f0;--ink-muted:#a9b3ae}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--ink);font:16px/1.5 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
.fig{text-align:center}
.n{font-size:clamp(4rem,16vw,9rem);font-weight:800;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
p{margin:8px 0 0;color:var(--ink-muted)}
</style>
</head>
<body>
<main class="fig">
  <div class="n"><span class="sr" style="position:absolute;left:-9999px">62,826</span><span id="n" aria-hidden="true">62,826</span></div>
  <p>passengers carried in the last 7 days</p>
</main>
<script>
const el = document.getElementById('n'), target = 62826
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
const fmt = new Intl.NumberFormat('en')
if (!reduce) {
  el.textContent = '0'
  const io = new IntersectionObserver(([e]) => {
    if (!e.isIntersecting) return
    io.disconnect()
    const t0 = performance.now(), dur = 800
    const tick = (t) => { const k = Math.min(1, (t - t0) / dur), eased = 1 - Math.pow(1 - k, 3); el.textContent = fmt.format(Math.round(target * eased)); if (k < 1) requestAnimationFrame(tick) }
    requestAnimationFrame(tick)
  })
  io.observe(el)
}
</script>
</body>
</html>
