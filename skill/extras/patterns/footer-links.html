<!doctype html>
<!--
pattern: footer-links
title: Footer with link columns that meet the 44px target
category: Sections
tier: lite
when: Every site. A footer with brand line, three short link columns and legal text, where every link is a comfortable touch target.
a11y: footer landmark; each column has a heading and a list; links are block elements with 44px height (not tiny inline text); colour pairs checked on the dark ground.
adapt: Keep to three columns and under six links each. Put the legal line last. At 375 columns become two, then one.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Footer</title>
<style>
:root{--surface:#101a17;--ink:#edf1ee;--ink-muted:#a9b6b0;--accent:#f3c93e;--border:#2a3a35}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#fff}
footer{background:var(--surface);color:var(--ink);padding:48px 16px 24px}
.in{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:32px}
.brand{font-weight:800;font-size:1.25rem}
.brand p{font-weight:400;font-size:.9375rem;color:var(--ink-muted);max-width:22em;margin:8px 0 0}
h2{margin:0 0 8px;font-size:.8125rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted)}
ul{list-style:none;margin:0;padding:0}
a{display:flex;align-items:center;min-height:44px;color:var(--ink);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.legal{max-width:1100px;margin:32px auto 0;padding-top:16px;border-top:1px solid var(--border);font-size:.875rem;color:var(--ink-muted)}
@media (max-width:760px){.in{grid-template-columns:1fr 1fr}.brand{grid-column:1/-1}}
</style>
</head>
<body>
<footer>
  <div class="in">
    <div class="brand">Relay<p>A weekly ledger of what customers asked for, built from the tickets you already have.</p></div>
    <nav aria-label="Product"><h2>Product</h2><ul><li><a href="#">How it works</a></li><li><a href="#">What it does</a></li><li><a href="#">Pricing</a></li></ul></nav>
    <nav aria-label="Help"><h2>Help</h2><ul><li><a href="#">FAQ</a></li><li><a href="#">Security</a></li><li><a href="#">Contact</a></li></ul></nav>
    <nav aria-label="Company"><h2>Company</h2><ul><li><a href="#">About</a></li><li><a href="#">Customers</a></li><li><a href="#">Privacy</a></li></ul></nav>
  </div>
  <p class="legal">&copy; 2026 Relay Labs, Inc.</p>
</footer>
</body>
</html>
