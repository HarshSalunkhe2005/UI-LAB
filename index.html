<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI Lab</title>
    <meta name="description" content="A live, runnable library of UI patterns: tokens, components, motion and layouts." />
    <meta name="theme-color" content="#08080a" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23818cf8%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2216%22 text-anchor=%22middle%22 font-family=%22Georgia%22 font-style=%22italic%22 fill=%22%2308080a%22%3EL%3C/text%3E%3C/svg%3E" />
    <script>
      // Set theme before paint to avoid a light/dark flash.
      try {
        const t = localStorage.getItem('ui-lab-theme') || 'dark'
        if (t !== 'system') document.documentElement.dataset.theme = t
      } catch {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
